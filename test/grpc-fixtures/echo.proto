syntax = "proto3";

package echov1;

option go_package = "echov1";

// Echo is a minimal test service used to exercise schema-aware gRPC
// inspection in the WAF test corpus.
service Echo {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc Search(SearchRequest) returns (SearchReply);
}

message HelloRequest {
  string name = 1;
  string greeting = 2;
}

message HelloReply {
  string message = 1;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
  repeated string tags = 3;
  Nested meta = 4;
}

message SearchReply {
  repeated string results = 1;
}

message Nested {
  string note = 1;
}

# Reference Envoy bootstrap wiring SentinelWAF's ext_proc sidecar into the
# mesh data plane.
#
# This config lives on an Envoy proxy (the Istio data plane) and tells it to
# stream every HTTP request's headers and body to the SentinelWAF ext_proc
# gRPC service (internal/envoy). SentinelWAF replies with an allow/block
# verdict that Envoy enforces — the WAF decision engine never sits in the
# request path itself.
#
# Typical layout in a pod:
#   sidecar-istio:  Envoy (data plane)   -> 127.0.0.1:5090 (ext_proc, gRPC)
#   sidecar-waf:    SentinelWAF gateway running with envoy.listen=:5090
#
# Wire this via a listener/filter chain; the cluster "sentinelwaf_ext_proc"
# must point at the SentinelWAF sidecar (e.g. 127.0.0.1:5090) in your mesh.

static_resources:
  clusters:
    # The SentinelWAF decision engine, reached over plaintext gRPC inside the
    # pod. Use TLS + auth in production and reference it via mesh DNS.
    - name: sentinelwaf_ext_proc
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: sentinelwaf_ext_proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 5090
      http2_protocol_options: {}

  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_upstream }
                http_filters:
                  # SentinelWAF inspection runs first; if it issues an
                  # ImmediateResponse the request never reaches the backend.
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: sentinelwaf_ext_proc
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_header_mode: SKIP
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                      fail_open: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
